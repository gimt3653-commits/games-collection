<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배틀 로얄</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            cursor: none;
        }
        #gameContainer { position: relative; }
        canvas {
            border: 2px solid #ff6b35;
            box-shadow: 0 0 50px rgba(255, 107, 53, 0.3);
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
        #hud div { margin-bottom: 5px; }
        .bar {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 3px;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.3s;
            background: linear-gradient(90deg, #e74c3c, #2ecc71);
        }
        #ammoDisplay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        #minimap {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff6b35;
            border-radius: 5px;
        }
        #killFeed {
            position: absolute;
            top: 170px;
            right: 10px;
            color: #fff;
            font-size: 12px;
            text-align: right;
            pointer-events: none;
        }
        .kill-message {
            margin-bottom: 3px;
            opacity: 0.9;
            text-shadow: 1px 1px 2px #000;
        }
        #zoneWarning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e74c3c;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.8);
            display: none;
            pointer-events: none;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
        }
        #startScreen h1, #gameOverScreen h1 {
            font-size: 56px;
            color: #ff6b35;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
            margin-bottom: 20px;
        }
        #startScreen p, #gameOverScreen p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }
        .btn {
            padding: 15px 50px;
            font-size: 22px;
            background: #ff6b35;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn:hover {
            background: #ff8c5a;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
        }
        #gameOverScreen { display: none; }
        #finalStats {
            font-size: 24px;
            margin-bottom: 30px;
        }
        #finalStats span {
            color: #ff6b35;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1200" height="800"></canvas>
        <div id="hud">
            <div>체력</div>
            <div class="bar" id="healthBar">
                <div class="bar-fill" style="width: 100%"></div>
            </div>
            <div style="margin-top: 10px;">킬: <span id="killCount">0</span></div>
            <div>생존자: <span id="survivors">50</span></div>
        </div>
        <canvas id="minimap" width="150" height="150"></canvas>
        <div id="killFeed"></div>
        <div id="zoneWarning">⚠ 존 밖입니다! ⚠</div>
        <div id="ammoDisplay">
            <span id="ammo">30</span> / <span id="reserveAmmo">90</span>
        </div>
        <div id="startScreen">
            <h1>배틀 로얄</h1>
            <p>WASD - 이동<br>마우스 - 조준 / 클릭 - 사격<br>R - 재장전<br><br>마지막까지 살아남으세요!</p>
            <button class="btn" id="startBtn">게임 시작</button>
        </div>
        <div id="gameOverScreen">
            <h1 id="gameOverTitle">게임 오버</h1>
            <div id="finalStats">
                순위: <span id="rank">#1</span><br>
                킬: <span id="finalKills">0</span><br>
                생존 시간: <span id="survivedTime">0:00</span>
            </div>
            <button class="btn" id="restartBtn">다시 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');

        let gameRunning = false;
        let gameTime = 0;
        let lastTime = 0;

        const WORLD_SIZE = 3000;
        const camera = { x: 0, y: 0 };

        const player = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            radius: 15,
            speed: 4,
            health: 100,
            maxHealth: 100,
            ammo: 30,
            maxAmmo: 30,
            reserveAmmo: 90,
            angle: 0,
            kills: 0,
            lastShot: 0,
            fireRate: 150,
            reloading: false,
            reloadTime: 2000
        };

        let enemies = [];
        let bullets = [];
        let particles = [];
        let obstacles = [];
        let loot = [];
        let zone = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            radius: WORLD_SIZE / 2,
            shrinkRate: 0.3,
            damage: 2
        };

        const keys = {};
        let mouseX = 0, mouseY = 0;
        let mouseDown = false;

        function generateWorld() {
            obstacles = [];
            for (let i = 0; i < 80; i++) {
                obstacles.push({
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    width: 30 + Math.random() * 80,
                    height: 30 + Math.random() * 80,
                    color: 'hsl(' + (30 + Math.random() * 20) + ', 30%, ' + (25 + Math.random() * 15) + '%)'
                });
            }
            loot = [];
            for (let i = 0; i < 40; i++) {
                loot.push({
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    type: Math.random() > 0.5 ? 'ammo' : 'health',
                    amount: 30
                });
            }
            for (let i = 0; i < 49; i++) {
                spawnEnemy();
            }
        }

        function spawnEnemy() {
            let x, y;
            do {
                x = Math.random() * WORLD_SIZE;
                y = Math.random() * WORLD_SIZE;
            } while (Math.hypot(x - player.x, y - player.y) < 300);
            enemies.push({
                x: x, y: y, radius: 15,
                speed: 1.5 + Math.random() * 1.5,
                health: 100, maxHealth: 100,
                angle: Math.random() * Math.PI * 2,
                state: 'roam',
                targetX: x, targetY: y,
                lastShot: 0,
                fireRate: 800 + Math.random() * 400,
                stateTimer: 0,
                color: 'hsl(' + Math.random() * 360 + ', 60%, 50%)'
            });
        }

        function shoot(shooter, isPlayer) {
            const now = Date.now();
            if (now - shooter.lastShot < shooter.fireRate) return;
            if (isPlayer && shooter.ammo <= 0) return;
            shooter.lastShot = now;
            if (isPlayer) shooter.ammo--;
            const spread = isPlayer ? 0.05 : 0.15;
            const angle = shooter.angle + (Math.random() - 0.5) * spread;
            bullets.push({
                x: shooter.x + Math.cos(angle) * 20,
                y: shooter.y + Math.sin(angle) * 20,
                vx: Math.cos(angle) * 12,
                vy: Math.sin(angle) * 12,
                damage: isPlayer ? 25 : 15,
                isPlayer: isPlayer,
                life: 100
            });
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: shooter.x + Math.cos(angle) * 25,
                    y: shooter.y + Math.sin(angle) * 25,
                    vx: Math.cos(angle + (Math.random() - 0.5)) * 3,
                    vy: Math.sin(angle + (Math.random() - 0.5)) * 3,
                    life: 1, color: '#ffaa00', size: 3 + Math.random() * 3
                });
            }
        }

        function reload() {
            if (player.reloading || player.ammo === player.maxAmmo || player.reserveAmmo <= 0) return;
            player.reloading = true;
            setTimeout(function() {
                const needed = player.maxAmmo - player.ammo;
                const available = Math.min(needed, player.reserveAmmo);
                player.ammo += available;
                player.reserveAmmo -= available;
                player.reloading = false;
                updateAmmoDisplay();
            }, player.reloadTime);
        }

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1, color: color, size: 2 + Math.random() * 4
                });
            }
        }

        function damageEntity(entity, damage) {
            entity.health -= damage;
            createExplosion(entity.x, entity.y, '#e74c3c', 8);
            if (entity.health <= 0) {
                createExplosion(entity.x, entity.y, '#ff6b35', 25);
                return true;
            }
            return false;
        }

        function updateEnemyAI(enemy, deltaTime) {
            const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
            enemy.stateTimer += deltaTime;
            if (distToPlayer < 400) {
                enemy.state = 'chase';
            } else if (enemy.state === 'chase' && distToPlayer > 500) {
                enemy.state = 'roam';
                enemy.stateTimer = 0;
            }
            if (enemy.state === 'roam') {
                if (enemy.stateTimer > 3000 || Math.hypot(enemy.targetX - enemy.x, enemy.targetY - enemy.y) < 50) {
                    enemy.targetX = Math.random() * WORLD_SIZE;
                    enemy.targetY = Math.random() * WORLD_SIZE;
                    enemy.stateTimer = 0;
                }
                const angle = Math.atan2(enemy.targetY - enemy.y, enemy.targetX - enemy.x);
                enemy.angle = angle;
                enemy.x += Math.cos(angle) * enemy.speed * 0.5;
                enemy.y += Math.sin(angle) * enemy.speed * 0.5;
            } else {
                const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                enemy.angle = angle;
                if (distToPlayer > 200) {
                    enemy.x += Math.cos(angle) * enemy.speed;
                    enemy.y += Math.sin(angle) * enemy.speed;
                } else if (distToPlayer < 100) {
                    enemy.x -= Math.cos(angle) * enemy.speed * 0.5;
                    enemy.y -= Math.sin(angle) * enemy.speed * 0.5;
                }
                if (distToPlayer < 350 && Math.random() < 0.02) {
                    shoot(enemy, false);
                }
            }
            const distToZone = Math.hypot(zone.x - enemy.x, zone.y - enemy.y);
            if (distToZone > zone.radius * 0.8) {
                const angle = Math.atan2(zone.y - enemy.y, zone.x - enemy.x);
                enemy.x += Math.cos(angle) * enemy.speed * 0.7;
                enemy.y += Math.sin(angle) * enemy.speed * 0.7;
            }
            enemy.x = Math.max(20, Math.min(WORLD_SIZE - 20, enemy.x));
            enemy.y = Math.max(20, Math.min(WORLD_SIZE - 20, enemy.y));
        }

        function update(deltaTime) {
            if (!gameRunning) return;
            gameTime += deltaTime;

            let dx = 0, dy = 0;
            if (keys['w'] || keys['W']) dy -= 1;
            if (keys['s'] || keys['S']) dy += 1;
            if (keys['a'] || keys['A']) dx -= 1;
            if (keys['d'] || keys['D']) dx += 1;
            if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                player.x += (dx / len) * player.speed;
                player.y += (dy / len) * player.speed;
            }

            player.angle = Math.atan2(mouseY - canvas.height / 2, mouseX - canvas.width / 2);

            if (mouseDown && !player.reloading) {
                shoot(player, true);
            }

            if (gameTime > 10000 && zone.radius > 100) {
                zone.radius -= zone.shrinkRate * deltaTime * 0.001;
            }

            const playerZoneDist = Math.hypot(zone.x - player.x, zone.y - player.y);
            if (playerZoneDist > zone.radius) {
                player.health -= zone.damage * deltaTime * 0.001;
                document.getElementById('zoneWarning').style.display = 'block';
            } else {
                document.getElementById('zoneWarning').style.display = 'none';
            }

            if (player.health <= 0) {
                endGame(false);
                return;
            }

            enemies.forEach(function(enemy) {
                const dist = Math.hypot(zone.x - enemy.x, zone.y - enemy.y);
                if (dist > zone.radius) {
                    enemy.health -= zone.damage * deltaTime * 0.001;
                }
            });

            enemies.forEach(function(enemy) {
                if (enemy.health > 0) {
                    updateEnemyAI(enemy, deltaTime);
                }
            });

            enemies = enemies.filter(function(enemy) {
                if (enemy.health <= 0) {
                    addKillMessage('적을 처치했습니다!');
                    return false;
                }
                return true;
            });

            bullets = bullets.filter(function(bullet) {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                bullet.life--;
                if (bullet.life <= 0) return false;
                for (const obs of obstacles) {
                    if (bullet.x > obs.x && bullet.x < obs.x + obs.width &&
                        bullet.y > obs.y && bullet.y < obs.y + obs.height) {
                        createExplosion(bullet.x, bullet.y, '#888', 5);
                        return false;
                    }
                }
                if (bullet.isPlayer) {
                    for (const enemy of enemies) {
                        if (Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < enemy.radius) {
                            if (damageEntity(enemy, bullet.damage)) {
                                player.kills++;
                                document.getElementById('killCount').textContent = player.kills;
                            }
                            return false;
                        }
                    }
                } else {
                    if (Math.hypot(bullet.x - player.x, bullet.y - player.y) < player.radius) {
                        if (damageEntity(player, bullet.damage)) {
                            endGame(false);
                        }
                        return false;
                    }
                }
                return true;
            });

            particles = particles.filter(function(p) {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                p.size *= 0.95;
                return p.life > 0;
            });

            loot = loot.filter(function(item) {
                if (Math.hypot(player.x - item.x, player.y - item.y) < 30) {
                    if (item.type === 'ammo') {
                        player.reserveAmmo += item.amount;
                        addKillMessage('탄약 획득!');
                    } else {
                        player.health = Math.min(player.maxHealth, player.health + item.amount);
                        addKillMessage('체력 회복!');
                    }
                    updateAmmoDisplay();
                    return false;
                }
                return true;
            });

            if (enemies.length === 0) {
                endGame(true);
            }

            document.getElementById('survivors').textContent = enemies.length + 1;
            document.querySelector('#healthBar .bar-fill').style.width =
                Math.max(0, (player.health / player.maxHealth) * 100) + '%';
            updateAmmoDisplay();
        }

        function updateAmmoDisplay() {
            document.getElementById('ammo').textContent = player.ammo;
            document.getElementById('reserveAmmo').textContent = player.reserveAmmo;
        }

        function addKillMessage(text) {
            const feed = document.getElementById('killFeed');
            const msg = document.createElement('div');
            msg.className = 'kill-message';
            msg.textContent = text;
            feed.insertBefore(msg, feed.firstChild);
            while (feed.children.length > 5) {
                feed.removeChild(feed.lastChild);
            }
            setTimeout(function() {
                if (msg.parentNode) msg.parentNode.removeChild(msg);
            }, 3000);
        }

        function render() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;
            ctx.save();
            ctx.translate(-camera.x, -camera.y);
            drawGrid();
            ctx.save();
            ctx.beginPath();
            ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(231, 76, 60, 0.5)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 10]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(231, 76, 60, 0.1)';
            ctx.fillRect(camera.x, camera.y, canvas.width, canvas.height);
            ctx.restore();
            obstacles.forEach(function(obs) {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            });
            loot.forEach(function(item) {
                ctx.save();
                ctx.translate(item.x, item.y);
                if (item.type === 'ammo') {
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(-8, -8, 16, 16);
                    ctx.fillStyle = '#000';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('A', 0, 4);
                } else {
                    ctx.fillStyle = '#2ecc71';
                    ctx.beginPath();
                    ctx.arc(0, 0, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-2, -6, 4, 12);
                    ctx.fillRect(-6, -2, 12, 4);
                }
                ctx.restore();
            });
            enemies.forEach(function(enemy) {
                if (enemy.health <= 0) return;
                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                ctx.rotate(enemy.angle);
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#333';
                ctx.fillRect(10, -3, 20, 6);
                ctx.restore();
                const barWidth = 40;
                const barHeight = 5;
                ctx.fillStyle = '#333';
                ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemy.radius - 15, barWidth, barHeight);
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemy.radius - 15,
                    barWidth * (enemy.health / enemy.maxHealth), barHeight);
            });
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(10, -4, 25, 8);
            ctx.restore();
            bullets.forEach(function(bullet) {
                ctx.fillStyle = bullet.isPlayer ? '#f1c40f' : '#e74c3c';
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            particles.forEach(function(p) {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            ctx.restore();
            drawMinimap();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 100;
            const startX = Math.floor(camera.x / gridSize) * gridSize;
            const startY = Math.floor(camera.y / gridSize) * gridSize;
            for (let x = startX; x < camera.x + canvas.width + gridSize; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, camera.y);
                ctx.lineTo(x, camera.y + canvas.height);
                ctx.stroke();
            }
            for (let y = startY; y < camera.y + canvas.height + gridSize; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(camera.x, y);
                ctx.lineTo(camera.x + canvas.width, y);
                ctx.stroke();
            }
        }

        function drawMinimap() {
            minimapCtx.fillStyle = '#111';
            minimapCtx.fillRect(0, 0, 150, 150);
            const scale = 150 / WORLD_SIZE;
            minimapCtx.beginPath();
            minimapCtx.arc(zone.x * scale, zone.y * scale, zone.radius * scale, 0, Math.PI * 2);
            minimapCtx.strokeStyle = '#e74c3c';
            minimapCtx.lineWidth = 1;
            minimapCtx.stroke();
            minimapCtx.fillStyle = '#e74c3c';
            enemies.forEach(function(enemy) {
                minimapCtx.beginPath();
                minimapCtx.arc(enemy.x * scale, enemy.y * scale, 2, 0, Math.PI * 2);
                minimapCtx.fill();
            });
            minimapCtx.fillStyle = '#3498db';
            minimapCtx.beginPath();
            minimapCtx.arc(player.x * scale, player.y * scale, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function endGame(victory) {
            gameRunning = false;
            document.body.style.cursor = 'default';
            const screen = document.getElementById('gameOverScreen');
            const title = document.getElementById('gameOverTitle');
            title.textContent = victory ? '🏆 승리!' : '💀 게임 오버';
            title.style.color = victory ? '#2ecc71' : '#e74c3c';
            document.getElementById('rank').textContent = '#' + (enemies.length + 1);
            document.getElementById('finalKills').textContent = player.kills;
            const minutes = Math.floor(gameTime / 60000);
            const seconds = Math.floor((gameTime % 60000) / 1000);
            document.getElementById('survivedTime').textContent = minutes + ':' + String(seconds).padStart(2, '0');
            screen.style.display = 'flex';
        }

        function startGame() {
            player.x = WORLD_SIZE / 2;
            player.y = WORLD_SIZE / 2;
            player.health = player.maxHealth;
            player.ammo = player.maxAmmo;
            player.reserveAmmo = 90;
            player.kills = 0;
            player.reloading = false;
            enemies = [];
            bullets = [];
            particles = [];
            loot = [];
            gameTime = 0;
            zone.radius = WORLD_SIZE / 2;
            zone.x = WORLD_SIZE / 2;
            zone.y = WORLD_SIZE / 2;
            generateWorld();
            document.getElementById('killCount').textContent = '0';
            document.getElementById('survivors').textContent = '50';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('killFeed').innerHTML = '';
            document.body.style.cursor = 'none';
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            update(deltaTime);
            render();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', function(e) {
            keys[e.key] = true;
            if (e.key === 'r' || e.key === 'R') reload();
        });
        document.addEventListener('keyup', function(e) {
            keys[e.key] = false;
        });
        canvas.addEventListener('mousemove', function(e) {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', function() { mouseDown = true; });
        canvas.addEventListener('mouseup', function() { mouseDown = false; });
        canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        generateWorld();
        render();
    </script>
</body>
</html>
