<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방 탈출 - 귀신 도망치기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        #gameCanvas { display: block; }
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            z-index: 100;
            text-shadow: 1px 1px 3px #000;
        }
        #hud div { margin-bottom: 8px; }
        .bar {
            width: 200px;
            height: 15px;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.3s;
        }
        #staminaBar .bar-fill {
            background: linear-gradient(90deg, #0066ff, #00ccff);
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            z-index: 100;
            pointer-events: none;
        }
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            z-index: 50;
        }
        #dangerVignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(139,0,0,0.6) 100%);
            z-index: 55;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #damageOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(139, 0, 0, 0);
            pointer-events: none;
            z-index: 60;
            transition: background 0.1s;
        }
        #startScreen, #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 200;
        }
        #startScreen h1, #gameOverScreen h1 {
            font-size: 56px;
            color: #8b0000;
            text-shadow: 0 0 30px rgba(139, 0, 0, 0.8);
            margin-bottom: 20px;
            animation: flicker 3s infinite;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            52% { opacity: 0.3; }
            54% { opacity: 0.9; }
        }
        #startScreen p, #gameOverScreen p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.8;
        }
        .btn {
            padding: 15px 50px;
            font-size: 22px;
            background: #8b0000;
            color: #fff;
            border: 2px solid #ff0000;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
        }
        .btn:hover {
            background: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }
        #gameOverScreen { display: none; }
        #message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
        }
        #objective {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #ffcc00;
            font-size: 16px;
            z-index: 100;
            text-shadow: 1px 1px 3px #000;
            text-align: right;
        }
        #ghostWarning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            z-index: 100;
            display: none;
            animation: pulse 0.5s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.1); }
        }
        #hidePrompt {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 18px;
            z-index: 100;
            display: none;
            text-shadow: 1px 1px 3px #000;
        }
    </style>
</head>
<body>
    <div id="vignette"></div>
    <div id="dangerVignette"></div>
    <div id="damageOverlay"></div>
    <div id="crosshair"></div>

    <div id="hud">
        <div>스태미나</div>
        <div class="bar" id="staminaBar">
            <div class="bar-fill" style="width: 100%"></div>
        </div>
        <div style="margin-top: 10px;">열쇠: <span id="keyCount">0</span> / 3</div>
        <div style="margin-top: 5px;">단서: <span id="clueCount">0</span> / 5</div>
    </div>

    <div id="objective">
        목표: 3개의 열쇠를 찾아 탈출하세요
    </div>

    <div id="ghostWarning">👻 귀신 출현! 도망치세요!</div>
    <div id="hidePrompt">E - 옷장에 숨기</div>
    <div id="message"></div>

    <div id="startScreen">
        <h1>방 탈출</h1>
        <p>WASD - 이동<br>마우스 - 시점 이동<br>Shift - 달리기<br>E - 상호작용 / 숨기<br><br>귀신이 나타나면 도망치거나 옷장에 숨으세요!<br>3개의 열쇠를 모아 탈출하세요.</p>
        <button class="btn" id="startBtn">게임 시작</button>
    </div>

    <div id="gameOverScreen">
        <h1 id="gameOverTitle">게임 오버</h1>
        <p id="gameOverText">귀신에게 잡혔습니다...</p>
        <button class="btn" id="restartBtn">다시 시작</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, clock;
        let player = { x: 0, z: 0, y: 1.7, angle: 0, pitch: 0 };
        let keys = {};
        let isPointerLocked = false;
        let gameRunning = false;
        let stamina = 100;
        let keysCollected = 0;
        let totalKeys = 3;
        let cluesCollected = 0;
        let totalClues = 5;
        let ghost = null;
        let ghostActive = false;
        let ghostTimer = 0;
        let ghostSpawnInterval = 15000;
        let hidingSpots = [];
        let keyObjects = [];
        let clueObjects = [];
        let exitDoor = null;
        let walls = [];
        let isHiding = false;
        let currentHidingSpot = null;
        let heartbeatTimer = 0;
        let ghostChaseSpeed = 0.08;
        let audioCtx = null;
        let footstepInterval = null;
        let breathingInterval = null;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, duration, type, volume) {
            if (!audioCtx) return;
            type = type || 'sine';
            volume = volume || 0.1;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playFootstep() {
            playSound(50 + Math.random() * 30, 0.08, 'triangle', 0.04);
        }

        function playHeartbeat() {
            playSound(40, 0.15, 'sine', 0.2);
            setTimeout(function() { playSound(35, 0.1, 'sine', 0.15); }, 150);
        }

        function playGhostSound() {
            playSound(200, 0.5, 'sawtooth', 0.15);
            playSound(150, 0.7, 'square', 0.1);
            playSound(80, 1.0, 'sawtooth', 0.12);
        }

        function playKeyPickup() {
            playSound(523, 0.1, 'sine', 0.1);
            setTimeout(function() { playSound(659, 0.1, 'sine', 0.1); }, 100);
            setTimeout(function() { playSound(784, 0.2, 'sine', 0.1); }, 200);
        }

        function playBreathing() {
            playSound(100 + Math.random() * 50, 0.3, 'sine', 0.03);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 1, 25);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(player.x, player.y, player.z);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            const ambientLight = new THREE.AmbientLight(0x111111, 0.2);
            scene.add(ambientLight);

            const flashlight = new THREE.SpotLight(0xffffee, 1, 20, Math.PI / 6, 0.5, 1);
            flashlight.position.set(0, 0, 0);
            flashlight.castShadow = true;
            flashlight.shadow.mapSize.width = 1024;
            flashlight.shadow.mapSize.height = 1024;
            camera.add(flashlight);
            camera.add(flashlight.target);
            flashlight.target.position.set(0, 0, -1);
            scene.add(camera);

            createMansion();

            document.addEventListener('keydown', function(e) {
                keys[e.key.toLowerCase()] = true;
                if (e.key.toLowerCase() === 'e') handleInteraction();
            });
            document.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', function() {
                if (gameRunning && !isPointerLocked) {
                    renderer.domElement.requestPointerLock();
                }
            });
            document.addEventListener('pointerlockchange', function() {
                isPointerLocked = document.pointerLockElement === renderer.domElement;
            });
            window.addEventListener('resize', onWindowResize);

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', function() { location.reload(); });

            animate();
        }

        function createMansion() {
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const ceilGeo = new THREE.PlaneGeometry(50, 50);
            const ceilMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a });
            const ceil = new THREE.Mesh(ceilGeo, ceilMat);
            ceil.rotation.x = Math.PI / 2;
            ceil.position.y = 4;
            scene.add(ceil);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.8 });

            createWall(-25, 0, 50, 1, wallMat);
            createWall(25, 0, 50, 1, wallMat);
            createWall(0, -25, 50, 1, wallMat, true);
            createWall(0, 25, 50, 1, wallMat, true);

            const innerWalls = [
                { x: -8, z: -8, w: 16, d: 0.5 },
                { x: 8, z: -8, w: 16, d: 0.5 },
                { x: -8, z: 8, w: 16, d: 0.5 },
                { x: 8, z: 8, w: 16, d: 0.5 },
                { x: -16, z: 0, w: 0.5, d: 16 },
                { x: 16, z: 0, w: 0.5, d: 16 },
                { x: 0, z: -16, w: 0.5, d: 16 },
                { x: 0, z: 16, w: 0.5, d: 16 },
                { x: -12, z: -4, w: 8, d: 0.5 },
                { x: 12, z: 4, w: 8, d: 0.5 },
                { x: -4, z: 12, w: 0.5, d: 8 },
                { x: 4, z: -12, w: 0.5, d: 8 },
                { x: -20, z: -20, w: 0.5, d: 10 },
                { x: 20, z: 20, w: 0.5, d: 10 },
            ];
            innerWalls.forEach(function(w) { createWall(w.x, w.z, w.w, w.d, wallMat); });

            const pillarGeo = new THREE.CylinderGeometry(0.3, 0.3, 4, 8);
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x3a2a2a });
            [[-12, -12], [12, -12], [-12, 12], [12, 12], [-20, 0], [20, 0], [0, -20], [0, 20]].forEach(function(pos) {
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(pos[0], 2, pos[1]);
                pillar.castShadow = true;
                scene.add(pillar);
            });

            // 옷장 (숨는 곳)
            const closetGeo = new THREE.BoxGeometry(1.5, 2.5, 1);
            const closetMat = new THREE.MeshStandardMaterial({ color: 0x4a3020 });
            const closetPositions = [
                { x: -22, z: -22 }, { x: 22, z: -22 }, { x: -22, z: 22 },
                { x: 22, z: 22 }, { x: 0, z: -22 }, { x: -22, z: 0 },
                { x: 22, z: 0 }, { x: 0, z: 22 }
            ];
            closetPositions.forEach(function(pos) {
                const closet = new THREE.Mesh(closetGeo, closetMat);
                closet.position.set(pos.x, 1.25, pos.z);
                closet.castShadow = true;
                closet.userData = { type: 'hidingSpot' };
                scene.add(closet);
                hidingSpots.push(closet);
            });

            // 열쇠
            const keyPositions = [
                { x: -20, z: -20 }, { x: 20, z: 20 }, { x: 0, z: 0 }
            ];
            keyPositions.forEach(function(pos) {
                const keyGeo = new THREE.TorusGeometry(0.3, 0.1, 8, 16);
                const keyMat = new THREE.MeshStandardMaterial({
                    color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.5
                });
                const key = new THREE.Mesh(keyGeo, keyMat);
                key.position.set(pos.x, 1.5, pos.z);
                key.userData = { type: 'key', collected: false };
                scene.add(key);
                keyObjects.push(key);
            });

            // 단서
            const cluePositions = [
                { x: -15, z: 5 }, { x: 15, z: -5 }, { x: -5, z: -15 },
                { x: 5, z: 15 }, { x: -18, z: 18 }
            ];
            cluePositions.forEach(function(pos) {
                const clueGeo = new THREE.BoxGeometry(0.3, 0.4, 0.05);
                const clueMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff, emissive: 0xffffcc, emissiveIntensity: 0.3
                });
                const clue = new THREE.Mesh(clueGeo, clueMat);
                clue.position.set(pos.x, 1.5, pos.z);
                clue.userData = { type: 'clue', collected: false };
                scene.add(clue);
                clueObjects.push(clue);
            });

            // 탈출 문
            const doorGeo = new THREE.BoxGeometry(2, 3, 0.2);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x4a3020, emissive: 0x000000 });
            exitDoor = new THREE.Mesh(doorGeo, doorMat);
            exitDoor.position.set(0, 1.5, -24.5);
            exitDoor.userData = { type: 'exit' };
            scene.add(exitDoor);
        }

        function createWall(x, z, width, depth, material, rotate) {
            rotate = rotate || false;
            const geo = new THREE.BoxGeometry(width, 4, depth);
            const wall = new THREE.Mesh(geo, material);
            wall.position.set(x, 2, z);
            if (rotate) wall.rotation.y = Math.PI / 2;
            wall.castShadow = true;
            wall.receiveShadow = true;
            wall.userData = { type: 'wall' };
            scene.add(wall);
            walls.push(wall);
        }

        function createGhost() {
            const group = new THREE.Group();

            // 몸체 (반투명)
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.8, 2.5, 8);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.4,
                emissive: 0xffffff,
                emissiveIntensity: 0.3
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.25;
            group.add(body);

            // 머리
            const headGeo = new THREE.SphereGeometry(0.4, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.5,
                emissive: 0xffffff,
                emissiveIntensity: 0.4
            });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.8;
            group.add(head);

            // 눈 (검은색)
            const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.15, 2.85, 0.35);
            group.add(leftEye);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.15, 2.85, 0.35);
            group.add(rightEye);

            // 입 (검은색)
            const mouthGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const mouth = new THREE.Mesh(mouthGeo, eyeMat);
            mouth.position.set(0, 2.6, 0.35);
            mouth.scale.set(1, 1.5, 0.5);
            group.add(mouth);

            // 팔
            const armGeo = new THREE.CylinderGeometry(0.06, 0.08, 1.5, 6);
            const armMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3,
                emissive: 0xffffff,
                emissiveIntensity: 0.2
            });
            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.set(-0.6, 1.5, 0);
            leftArm.rotation.z = 0.5;
            group.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.set(0.6, 1.5, 0);
            rightArm.rotation.z = -0.5;
            group.add(rightArm);

            // 플레이어 멀리서 스폰
            let x, z;
            do {
                x = (Math.random() - 0.5) * 40;
                z = (Math.random() - 0.5) * 40;
            } while (Math.hypot(x - player.x, z - player.z) < 15);

            group.position.set(x, 0, z);
            group.userData = {
                type: 'ghost',
                speed: ghostChaseSpeed,
                state: 'chase',
                body: body,
                head: head,
                leftArm: leftArm,
                rightArm: rightArm
            };

            scene.add(group);
            ghost = group;
            ghostActive = true;
        }

        function removeGhost() {
            if (ghost) {
                scene.remove(ghost);
                ghost = null;
            }
            ghostActive = false;
        }

        function onMouseMove(e) {
            if (!isPointerLocked || !gameRunning || isHiding) return;
            player.angle -= e.movementX * 0.002;
            player.pitch -= e.movementY * 0.002;
            player.pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, player.pitch));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            initAudio();
            gameRunning = true;
            renderer.domElement.requestPointerLock();

            footstepInterval = setInterval(function() {
                if ((keys['w'] || keys['a'] || keys['s'] || keys['d']) && !isHiding) {
                    playFootstep();
                }
            }, 350);

            breathingInterval = setInterval(function() {
                if (ghostActive && Math.random() < 0.4) {
                    playBreathing();
                }
            }, 2000);

            showMessage('조용히... 무언가 다가오고 있습니다...', 3000);
        }

        function showMessage(text, duration) {
            duration = duration || 3000;
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.opacity = 1;
            setTimeout(function() { msg.style.opacity = 0; }, duration);
        }

        function handleInteraction() {
            if (!gameRunning) return;

            // 숨기
            if (isHiding) {
                isHiding = false;
                currentHidingSpot = null;
                document.getElementById('hidePrompt').style.display = 'none';
                showMessage('옷장에서 나왔습니다', 1500);
                return;
            }

            // 가까운 옷장 찾기
            let nearCloset = null;
            let minDist = 3;
            hidingSpots.forEach(function(closet) {
                const dist = Math.hypot(player.x - closet.position.x, player.z - closet.position.z);
                if (dist < minDist) {
                    minDist = dist;
                    nearCloset = closet;
                }
            });

            if (nearCloset) {
                isHiding = true;
                currentHidingSpot = nearCloset;
                player.x = nearCloset.position.x;
                player.z = nearCloset.position.z;
                showMessage('옷장에 숨었습니다...', 2000);
                return;
            }

            // 열쇠 줍기
            keyObjects.forEach(function(key) {
                if (key.userData.collected) return;
                const dist = Math.hypot(player.x - key.position.x, player.z - key.position.z);
                if (dist < 2) {
                    key.userData.collected = true;
                    key.visible = false;
                    keysCollected++;
                    playKeyPickup();
                    updateHUD();
                    showMessage('열쇠 획득! (' + keysCollected + '/' + totalKeys + ')', 2000);
                    if (keysCollected >= totalKeys) {
                        showMessage('모든 열쇠 획득! 탈출구로!', 3000);
                        exitDoor.material.emissive.setHex(0x00ff00);
                        exitDoor.material.emissiveIntensity = 0.5;
                    }
                }
            });

            // 단서 줍기
            clueObjects.forEach(function(clue) {
                if (clue.userData.collected) return;
                const dist = Math.hypot(player.x - clue.position.x, player.z - clue.position.z);
                if (dist < 2) {
                    clue.userData.collected = true;
                    clue.visible = false;
                    cluesCollected++;
                    playKeyPickup();
                    updateHUD();
                    showMessage('단서 발견! (' + cluesCollected + '/' + totalClues + ')', 2000);
                }
            });
        }

        function updateHUD() {
            document.querySelector('#staminaBar .bar-fill').style.width = Math.max(0, stamina) + '%';
            document.getElementById('keyCount').textContent = keysCollected;
            document.getElementById('clueCount').textContent = cluesCollected;
        }

        function updatePlayer(delta) {
            if (isHiding) return;

            const isRunning = keys['shift'] && stamina > 0;
            const speed = isRunning ? 0.15 : 0.08;

            if (isRunning && (keys['w'] || keys['a'] || keys['s'] || keys['d'])) {
                stamina -= 0.5;
            } else {
                stamina = Math.min(100, stamina + 0.2);
            }

            let dx = 0, dz = 0;
            if (keys['w']) { dx -= Math.sin(player.angle) * speed; dz -= Math.cos(player.angle) * speed; }
            if (keys['s']) { dx += Math.sin(player.angle) * speed; dz += Math.cos(player.angle) * speed; }
            if (keys['a']) { dx -= Math.cos(player.angle) * speed; dz += Math.sin(player.angle) * speed; }
            if (keys['d']) { dx += Math.cos(player.angle) * speed; dz -= Math.sin(player.angle) * speed; }

            const newX = player.x + dx;
            const newZ = player.z + dz;

            let canMove = true;
            walls.forEach(function(wall) {
                const wx = wall.position.x;
                const wz = wall.position.z;
                const ww = wall.geometry.parameters.width / 2;
                const wd = wall.geometry.parameters.depth / 2;
                if (newX > wx - ww - 0.5 && newX < wx + ww + 0.5 &&
                    newZ > wz - wd - 0.5 && newZ < wz + wd + 0.5) {
                    canMove = false;
                }
            });

            if (canMove) {
                player.x = Math.max(-23, Math.min(23, newX));
                player.z = Math.max(-23, Math.min(23, newZ));
            }

            updateHUD();
        }

        function updateGhost(delta) {
            if (!ghostActive || !ghost) return;

            const dist = Math.hypot(player.x - ghost.position.x, player.z - ghost.position.z);

            // 플레이어 발견 (숨지 않은 경우)
            if (!isHiding && dist < 20) {
                ghost.userData.state = 'chase';
            } else if (isHiding && dist < 5) {
                // 숨었는데 들킴
                ghost.userData.state = 'search';
            } else if (ghost.userData.state === 'chase' && dist > 25) {
                ghost.userData.state = 'wander';
            }

            if (ghost.userData.state === 'chase') {
                const angle = Math.atan2(player.x - ghost.position.x, player.z - ghost.position.z);
                ghost.rotation.y = angle;
                ghost.position.x += Math.sin(angle) * ghost.userData.speed;
                ghost.position.z += Math.cos(angle) * ghost.userData.speed;

                // 귀신 접근 경고
                const warning = document.getElementById('ghostWarning');
                const dangerVignette = document.getElementById('dangerVignette');
                if (dist < 10) {
                    warning.style.display = 'block';
                    dangerVignette.style.opacity = Math.max(0, 1 - dist / 10);
                } else {
                    warning.style.display = 'none';
                    dangerVignette.style.opacity = 0;
                }

                // 잡힘
                if (dist < 1.5) {
                    endGame(false, '귀신에게 잡혔습니다...');
                }
            } else if (ghost.userData.state === 'search') {
                // 옷장 주변을 맴돌기
                const angle = Date.now() * 0.002;
                ghost.position.x = player.x + Math.sin(angle) * 3;
                ghost.position.z = player.z + Math.cos(angle) * 3;
                ghost.rotation.y = angle + Math.PI / 2;

                // 일정 시간 후 포기
                ghostTimer += delta * 1000;
                if (ghostTimer > 5000) {
                    ghost.userData.state = 'wander';
                    ghostTimer = 0;
                    showMessage('귀신이 포기한 것 같습니다...', 2000);
                }
            } else {
                // 배회
                if (Math.random() < 0.01) {
                    ghost.userData.targetX = (Math.random() - 0.5) * 40;
                    ghost.userData.targetZ = (Math.random() - 0.5) * 40;
                }
                const angle = Math.atan2(
                    (ghost.userData.targetX || 0) - ghost.position.x,
                    (ghost.userData.targetZ || 0) - ghost.position.z
                );
                ghost.rotation.y = angle;
                ghost.position.x += Math.sin(angle) * ghost.userData.speed * 0.5;
                ghost.position.z += Math.cos(angle) * ghost.userData.speed * 0.5;

                document.getElementById('ghostWarning').style.display = 'none';
                document.getElementById('dangerVignette').style.opacity = 0;
            }

            // 귀신 애니메이션
            ghost.position.y = Math.sin(Date.now() * 0.003) * 0.2;
            ghost.userData.leftArm.rotation.z = 0.5 + Math.sin(Date.now() * 0.005) * 0.3;
            ghost.userData.rightArm.rotation.z = -0.5 - Math.sin(Date.now() * 0.005) * 0.3;

            // 귀신 색상 변화 (가까우면 더 붉게)
            const intensity = Math.max(0, 1 - dist / 20);
            ghost.userData.body.material.emissive.setRGB(intensity, 0, 0);
            ghost.userData.head.material.emissive.setRGB(intensity, 0, 0);

            // 심장박동
            if (dist < 15) {
                heartbeatTimer++;
                const rate = Math.max(20, dist * 4);
                if (heartbeatTimer > rate) {
                    heartbeatTimer = 0;
                    playHeartbeat();
                }
            }
        }

        function updateGhostSpawner(delta) {
            if (ghostActive) return;

            ghostTimer += delta * 1000;
            if (ghostTimer > ghostSpawnInterval) {
                ghostTimer = 0;
                ghostSpawnInterval = Math.max(8000, ghostSpawnInterval - 500);
                createGhost();
                playGhostSound();
                showMessage('귀신이 나타났습니다! 도망치거나 숨으세요!', 3000);
            }
        }

        function checkExit() {
            if (keysCollected >= totalKeys && exitDoor) {
                const dist = Math.hypot(player.x - exitDoor.position.x, player.z - exitDoor.position.z);
                if (dist < 3) {
                    endGame(true);
                }
            }
        }

        function endGame(victory, text) {
            gameRunning = false;
            document.exitPointerLock();

            if (footstepInterval) clearInterval(footstepInterval);
            if (breathingInterval) clearInterval(breathingInterval);

            const screen = document.getElementById('gameOverScreen');
            const title = document.getElementById('gameOverTitle');
            const msg = document.getElementById('gameOverText');

            if (victory) {
                title.textContent = '탈출 성공!';
                title.style.color = '#00ff00';
                msg.textContent = '방에서 탈출했습니다! 단서 ' + cluesCollected + '개 발견';
                playSound(523, 0.2, 'sine', 0.1);
                setTimeout(function() { playSound(659, 0.2, 'sine', 0.1); }, 200);
                setTimeout(function() { playSound(784, 0.4, 'sine', 0.1); }, 400);
            } else {
                title.textContent = '게임 오버';
                title.style.color = '#8b0000';
                msg.textContent = text || '귀신에게 잡혔습니다...';
                playSound(100, 1, 'sawtooth', 0.2);
            }

            screen.style.display = 'flex';
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (gameRunning) {
                updatePlayer(delta);
                updateGhost(delta);
                updateGhostSpawner(delta);
                checkExit();

                // 숨었을 때 화면 어둡게
                if (isHiding) {
                    document.getElementById('vignette').style.background =
                        'radial-gradient(ellipse at center, transparent 10%, rgba(0,0,0,0.98) 100%)';
                } else {
                    document.getElementById('vignette').style.background =
                        'radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.8) 100%)';
                }
            }

            // 열쇠/단서 애니메이션
            keyObjects.forEach(function(key) {
                if (!key.userData.collected) {
                    key.rotation.y += 0.02;
                    key.position.y = 1.5 + Math.sin(Date.now() * 0.003) * 0.2;
                }
            });
            clueObjects.forEach(function(clue) {
                if (!clue.userData.collected) {
                    clue.rotation.y += 0.01;
                    clue.position.y = 1.5 + Math.sin(Date.now() * 0.002) * 0.15;
                }
            });

            // 탈출구 이펙트
            if (exitDoor && keysCollected >= totalKeys) {
                exitDoor.material.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.005) * 0.3;
            }

            // 침묵력 이펙트
            camera.position.set(player.x, player.y, player.z);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.angle;
            camera.rotation.x = player.pitch;

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
