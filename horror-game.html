<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 공포 게임</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        #gameCanvas {
            display: block;
        }
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            z-index: 100;
            text-shadow: 1px 1px 3px #000;
        }
        #hud div { margin-bottom: 8px; }
        .bar {
            width: 200px;
            height: 15px;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.3s;
        }
        #healthBar .bar-fill {
            background: linear-gradient(90deg, #8b0000, #ff0000);
        }
        #sanityBar .bar-fill {
            background: linear-gradient(90deg, #4a0080, #8b00ff);
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            z-index: 100;
            pointer-events: none;
        }
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            z-index: 50;
        }
        #damageOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(139, 0, 0, 0);
            pointer-events: none;
            z-index: 60;
            transition: background 0.1s;
        }
        #startScreen, #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 200;
        }
        #startScreen h1, #gameOverScreen h1 {
            font-size: 64px;
            color: #8b0000;
            text-shadow: 0 0 30px rgba(139, 0, 0, 0.8);
            margin-bottom: 20px;
            animation: flicker 3s infinite;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            52% { opacity: 0.3; }
            54% { opacity: 0.9; }
        }
        #startScreen p, #gameOverScreen p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.8;
        }
        .btn {
            padding: 15px 50px;
            font-size: 22px;
            background: #8b0000;
            color: #fff;
            border: 2px solid #ff0000;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
        }
        .btn:hover {
            background: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }
        #gameOverScreen { display: none; }
        #jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 150;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #jumpscare img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
        }
        #objective {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #ffcc00;
            font-size: 16px;
            z-index: 100;
            text-shadow: 1px 1px 3px #000;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="vignette"></div>
    <div id="damageOverlay"></div>
    <div id="crosshair"></div>

    <div id="hud">
        <div>체력</div>
        <div class="bar" id="healthBar">
            <div class="bar-fill" style="width: 100%"></div>
        </div>
        <div style="margin-top: 10px;">정신력</div>
        <div class="bar" id="sanityBar">
            <div class="bar-fill" style="width: 100%"></div>
        </div>
        <div style="margin-top: 10px;">열쇠: <span id="keyCount">0</span> / 5</div>
    </div>

    <div id="objective">
        목표: 5개의 열쇠를 찾아 탈출하세요
    </div>

    <div id="message"></div>

    <div id="startScreen">
        <h1>공포의 저택</h1>
        <p>WASD - 이동<br>마우스 - 시점 이동<br>Shift - 달리기<br>E - 상호작용<br><br>어두운 저택에서 5개의 열쇠를 찾아 탈출하세요.<br>무언가가 당신을 기다리고 있습니다...</p>
        <button class="btn" id="startBtn">게임 시작</button>
    </div>

    <div id="gameOverScreen">
        <h1 id="gameOverTitle">게임 오버</h1>
        <p id="gameOverText">당신은 저택에 갇혔습니다...</p>
        <button class="btn" id="restartBtn">다시 시작</button>
    </div>

    <div id="jumpscare"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, clock;
        let player = { x: 0, z: 0, y: 1.7, angle: 0, pitch: 0 };
        let keys = {};
        let mouseMovement = { x: 0, y: 0 };
        let isPointerLocked = false;
        let gameRunning = false;
        let health = 100;
        let sanity = 100;
        let keysCollected = 0;
        let totalKeys = 5;
        let monsters = [];
        let keyObjects = [];
        let exitDoor = null;
        let walls = [];
        let flickerTimer = 0;
        let flickerIntensity = 0;
        let heartbeatTimer = 0;
        let jumpscareCooldown = 0;
        let ambientSoundInterval = null;
        let footstepInterval = null;

        // 오디오 컨텍스트
        let audioCtx = null;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, duration, type = 'sine', volume = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playFootstep() {
            playSound(60 + Math.random() * 20, 0.1, 'triangle', 0.05);
        }

        function playHeartbeat() {
            playSound(40, 0.15, 'sine', 0.15);
            setTimeout(() => playSound(35, 0.1, 'sine', 0.1), 150);
        }

        function playJumpscareSound() {
            playSound(200, 0.5, 'sawtooth', 0.3);
            playSound(150, 0.7, 'square', 0.2);
            playSound(80, 1.0, 'sawtooth', 0.25);
        }

        function playKeyPickup() {
            playSound(523, 0.1, 'sine', 0.1);
            setTimeout(() => playSound(659, 0.1, 'sine', 0.1), 100);
            setTimeout(() => playSound(784, 0.2, 'sine', 0.1), 200);
        }

        function playAmbient() {
            const sounds = [
                () => playSound(50 + Math.random() * 30, 2, 'sine', 0.02),
                () => playSound(100 + Math.random() * 50, 0.5, 'triangle', 0.03),
                () => { playSound(200, 0.1, 'sawtooth', 0.02); setTimeout(() => playSound(180, 0.15, 'sawtooth', 0.02), 100); }
            ];
            sounds[Math.floor(Math.random() * sounds.length)]();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 1, 30);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(player.x, player.y, player.z);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // 조명
            const ambientLight = new THREE.AmbientLight(0x111111, 0.3);
            scene.add(ambientLight);

            // 손전등
            const flashlight = new THREE.SpotLight(0xffffee, 1, 20, Math.PI / 6, 0.5, 1);
            flashlight.position.set(0, 0, 0);
            flashlight.castShadow = true;
            flashlight.shadow.mapSize.width = 1024;
            flashlight.shadow.mapSize.height = 1024;
            camera.add(flashlight);
            camera.add(flashlight.target);
            flashlight.target.position.set(0, 0, -1);
            scene.add(camera);

            // 저택 생성
            createMansion();

            // 이벤트 리스너
            document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
            document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', () => {
                if (gameRunning && !isPointerLocked) {
                    renderer.domElement.requestPointerLock();
                }
            });
            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = document.pointerLockElement === renderer.domElement;
            });
            window.addEventListener('resize', onWindowResize);

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', () => location.reload());

            animate();
        }

        function createMansion() {
            // 바닥
            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                roughness: 0.9
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 천장
            const ceilGeo = new THREE.PlaneGeometry(60, 60);
            const ceilMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a });
            const ceil = new THREE.Mesh(ceilGeo, ceilMat);
            ceil.rotation.x = Math.PI / 2;
            ceil.position.y = 4;
            scene.add(ceil);

            // 벽 생성
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x2a1a1a,
                roughness: 0.8
            });

            // 외부 벽
            createWall(-30, 0, 60, 1, wallMat);
            createWall(30, 0, 60, 1, wallMat);
            createWall(0, -30, 60, 1, wallMat, true);
            createWall(0, 30, 60, 1, wallMat, true);

            // 내부 벽들 (복도와 방 생성)
            const innerWalls = [
                { x: -10, z: -10, w: 20, d: 0.5 },
                { x: 10, z: -10, w: 20, d: 0.5 },
                { x: -10, z: 10, w: 20, d: 0.5 },
                { x: 10, z: 10, w: 20, d: 0.5 },
                { x: -20, z: 0, w: 0.5, d: 20 },
                { x: 20, z: 0, w: 0.5, d: 20 },
                { x: 0, z: -20, w: 0.5, d: 20 },
                { x: 0, z: 20, w: 0.5, d: 20 },
                { x: -15, z: -5, w: 10, d: 0.5 },
                { x: 15, z: 5, w: 10, d: 0.5 },
                { x: -5, z: 15, w: 0.5, d: 10 },
                { x: 5, z: -15, w: 0.5, d: 10 },
            ];

            innerWalls.forEach(w => createWall(w.x, w.z, w.w, w.d, wallMat));

            // 기둥들
            const pillarGeo = new THREE.CylinderGeometry(0.3, 0.3, 4, 8);
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x3a2a2a });
            const pillarPositions = [
                [-15, -15], [15, -15], [-15, 15], [15, 15],
                [-25, 0], [25, 0], [0, -25], [0, 25]
            ];
            pillarPositions.forEach(pos => {
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(pos[0], 2, pos[1]);
                pillar.castShadow = true;
                scene.add(pillar);
            });

            // 열쇠 배치
            const keyPositions = [
                { x: -25, z: -25 },
                { x: 25, z: -25 },
                { x: -25, z: 25 },
                { x: 25, z: 25 },
                { x: 0, z: 0 }
            ];

            keyPositions.forEach(pos => {
                const keyGeo = new THREE.TorusGeometry(0.3, 0.1, 8, 16);
                const keyMat = new THREE.MeshStandardMaterial({
                    color: 0xffd700,
                    emissive: 0xffd700,
                    emissiveIntensity: 0.5
                });
                const key = new THREE.Mesh(keyGeo, keyMat);
                key.position.set(pos.x, 1.5, pos.z);
                key.userData = { type: 'key', collected: false };
                scene.add(key);
                keyObjects.push(key);
            });

            // 탈출 문
            const doorGeo = new THREE.BoxGeometry(2, 3, 0.2);
            const doorMat = new THREE.MeshStandardMaterial({
                color: 0x4a3020,
                emissive: 0x000000
            });
            exitDoor = new THREE.Mesh(doorGeo, doorMat);
            exitDoor.position.set(0, 1.5, -29.5);
            exitDoor.userData = { type: 'exit' };
            scene.add(exitDoor);

            // 몬스터 생성
            for (let i = 0; i < 3; i++) {
                createMonster();
            }
        }

        function createWall(x, z, width, depth, material, rotate = false) {
            const geo = new THREE.BoxGeometry(width, 4, depth);
            const wall = new THREE.Mesh(geo, material);
            wall.position.set(x, 2, z);
            if (rotate) wall.rotation.y = Math.PI / 2;
            wall.castShadow = true;
            wall.receiveShadow = true;
            wall.userData = { type: 'wall' };
            scene.add(wall);
            walls.push(wall);
        }

        function createMonster() {
            const group = new THREE.Group();

            // 몸체
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.6, 2, 8);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x1a0a0a,
                roughness: 1
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            group.add(body);

            // 머리
            const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.2;
            group.add(head);

            // 눈
            const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const eyeMat = new THREE.MeshStandardMaterial({
                color: 0xff0000,
                emissive: 0xff0000,
                emissiveIntensity: 1
            });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.12, 2.25, 0.3);
            group.add(leftEye);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.12, 2.25, 0.3);
            group.add(rightEye);

            // 팔
            const armGeo = new THREE.CylinderGeometry(0.08, 0.1, 1.2, 6);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x1a0a0a });
            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.set(-0.5, 1.2, 0);
            leftArm.rotation.z = 0.3;
            group.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.set(0.5, 1.2, 0);
            rightArm.rotation.z = -0.3;
            group.add(rightArm);

            // 랜덤 위치 배치
            let x, z;
            do {
                x = (Math.random() - 0.5) * 50;
                z = (Math.random() - 0.5) * 50;
            } while (Math.hypot(x - player.x, z - player.z) < 15);

            group.position.set(x, 0, z);
            group.userData = {
                type: 'monster',
                speed: 0.02 + Math.random() * 0.02,
                state: 'patrol',
                targetX: x,
                targetZ: z,
                lastAttack: 0,
                eyeLeft: leftEye,
                eyeRight: rightEye
            };

            scene.add(group);
            monsters.push(group);
        }

        function onMouseMove(e) {
            if (!isPointerLocked || !gameRunning) return;
            player.angle -= e.movementX * 0.002;
            player.pitch -= e.movementY * 0.002;
            player.pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, player.pitch));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            initAudio();
            gameRunning = true;
            renderer.domElement.requestPointerLock();

            // 발소리 인터벌
            footstepInterval = setInterval(() => {
                if (keys['w'] || keys['a'] || keys['s'] || keys['d']) {
                    playFootstep();
                }
            }, 400);

            // 환경 음 인터벌
            ambientSoundInterval = setInterval(() => {
                if (Math.random() < 0.3) {
                    playAmbient();
                }
            }, 3000);

            showMessage('어둠 속에서 무언가 움직이는 것 같습니다...', 3000);
        }

        function showMessage(text, duration = 3000) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.opacity = 1;
            setTimeout(() => { msg.style.opacity = 0; }, duration);
        }

        function triggerJumpscare() {
            if (jumpscareCooldown > 0) return;
            jumpscareCooldown = 10000;

            const js = document.getElementById('jumpscare');
            js.style.display = 'flex';
            playJumpscareSound();

            // 무작위 공포 이미지 (CSS로 생성)
            js.innerHTML = '<div style="font-size: 200px; animation: shake 0.1s infinite;">👁</div>';
            document.body.style.animation = 'shake 0.5s';

            setTimeout(() => {
                js.style.display = 'none';
                document.body.style.animation = '';
                health -= 20;
                sanity -= 30;
                updateHUD();

                const overlay = document.getElementById('damageOverlay');
                overlay.style.background = 'rgba(139, 0, 0, 0.5)';
                setTimeout(() => { overlay.style.background = 'rgba(139, 0, 0, 0)'; }, 200);

                if (health <= 0) {
                    endGame(false, '정신이 붕괴되었습니다...');
                }
            }, 500);
        }

        function updateHUD() {
            document.querySelector('#healthBar .bar-fill').style.width = Math.max(0, health) + '%';
            document.querySelector('#sanityBar .bar-fill').style.width = Math.max(0, sanity) + '%';
            document.getElementById('keyCount').textContent = keysCollected;
        }

        function checkInteractions() {
            // 열쇠 줍기
            keyObjects.forEach(key => {
                if (key.userData.collected) return;
                const dist = Math.hypot(player.x - key.position.x, player.z - key.position.z);
                if (dist < 2) {
                    showMessage('E를 눌러 열쇠를 줍으세요', 2000);
                    if (keys['e']) {
                        key.userData.collected = true;
                        key.visible = false;
                        keysCollected++;
                        playKeyPickup();
                        updateHUD();
                        showMessage('열쇠를 획득했습니다! (' + keysCollected + '/' + totalKeys + ')', 2000);

                        if (keysCollected >= totalKeys) {
                            showMessage('모든 열쇠를 모았습니다! 탈출구로 가세요!', 4000);
                            exitDoor.material.emissive.setHex(0x00ff00);
                            exitDoor.material.emissiveIntensity = 0.5;
                        }
                    }
                }
            });

            // 탈출
            if (keysCollected >= totalKeys && exitDoor) {
                const dist = Math.hypot(player.x - exitDoor.position.x, player.z - exitDoor.position.z);
                if (dist < 3) {
                    endGame(true);
                }
            }
        }

        function updateMonsters(delta) {
            monsters.forEach(monster => {
                const dist = Math.hypot(player.x - monster.position.x, player.z - monster.position.z);

                // 플레이어 발견
                if (dist < 15) {
                    monster.userData.state = 'chase';

                    // 점프 스케어
                    if (dist < 5 && jumpscareCooldown <= 0) {
                        triggerJumpscare();
                    }
                } else if (monster.userData.state === 'chase' && dist > 20) {
                    monster.userData.state = 'patrol';
                }

                if (monster.userData.state === 'chase') {
                    // 플레이어 추적
                    const angle = Math.atan2(player.x - monster.position.x, player.z - monster.position.z);
                    monster.rotation.y = angle;
                    monster.position.x += Math.sin(angle) * monster.userData.speed * 2;
                    monster.position.z += Math.cos(angle) * monster.userData.speed * 2;

                    // 공격
                    if (dist < 2 && Date.now() - monster.userData.lastAttack > 2000) {
                        monster.userData.lastAttack = Date.now();
                        health -= 15;
                        sanity -= 10;
                        updateHUD();

                        const overlay = document.getElementById('damageOverlay');
                        overlay.style.background = 'rgba(139, 0, 0, 0.4)';
                        setTimeout(() => { overlay.style.background = 'rgba(139, 0, 0, 0)'; }, 150);

                        playSound(100, 0.3, 'sawtooth', 0.2);

                        if (health <= 0) {
                            endGame(false, '몬스터에게 잡아먹혔습니다...');
                        }
                    }
                } else {
                    // 순찰
                    const distToTarget = Math.hypot(
                        monster.userData.targetX - monster.position.x,
                        monster.userData.targetZ - monster.position.z
                    );
                    if (distToTarget < 2) {
                        monster.userData.targetX = (Math.random() - 0.5) * 50;
                        monster.userData.targetZ = (Math.random() - 0.5) * 50;
                    }
                    const angle = Math.atan2(
                        monster.userData.targetX - monster.position.x,
                        monster.userData.targetZ - monster.position.z
                    );
                    monster.rotation.y = angle;
                    monster.position.x += Math.sin(angle) * monster.userData.speed;
                    monster.position.z += Math.cos(angle) * monster.userData.speed;
                }

                // 눈 빛남 효과
                const eyeIntensity = monster.userData.state === 'chase' ? 2 : 0.5;
                monster.userData.eyeLeft.material.emissiveIntensity = eyeIntensity;
                monster.userData.eyeRight.material.emissiveIntensity = eyeIntensity;

                // 몬스터 애니메이션 (흔들림)
                monster.position.y = Math.sin(Date.now() * 0.005) * 0.1;
            });
        }

        function updatePlayer(delta) {
            const speed = keys['shift'] ? 0.15 : 0.08;
            let dx = 0, dz = 0;

            if (keys['w']) { dx -= Math.sin(player.angle) * speed; dz -= Math.cos(player.angle) * speed; }
            if (keys['s']) { dx += Math.sin(player.angle) * speed; dz += Math.cos(player.angle) * speed; }
            if (keys['a']) { dx -= Math.cos(player.angle) * speed; dz += Math.sin(player.angle) * speed; }
            if (keys['d']) { dx += Math.cos(player.angle) * speed; dz -= Math.sin(player.angle) * speed; }

            const newX = player.x + dx;
            const newZ = player.z + dz;

            // 벽 충돌 검사
            let canMove = true;
            walls.forEach(wall => {
                const wx = wall.position.x;
                const wz = wall.position.z;
                const ww = wall.geometry.parameters.width / 2;
                const wd = wall.geometry.parameters.depth / 2;

                if (newX > wx - ww - 0.5 && newX < wx + ww + 0.5 &&
                    newZ > wz - wd - 0.5 && newZ < wz + wd + 0.5) {
                    canMove = false;
                }
            });

            if (canMove) {
                player.x = Math.max(-28, Math.min(28, newX));
                player.z = Math.max(-28, Math.min(28, newZ));
            }

            // 침묵력 감소 (어둠 속에서)
            sanity -= 0.005;
            if (sanity <= 0) {
                sanity = 0;
                health -= 0.01;
                if (health <= 0) {
                    endGame(false, '어둠에 삼켜졌습니다...');
                }
            }

            // 침묵력 회복 (가까운 열쇠에서)
            keyObjects.forEach(key => {
                if (key.userData.collected) return;
                const dist = Math.hypot(player.x - key.position.x, player.z - key.position.z);
                if (dist < 5) {
                    sanity = Math.min(100, sanity + 0.02);
                }
            });

            updateHUD();
        }

        function updateFlashlight(delta) {
            // 손전등 깜빡임
            flickerTimer += delta;
            if (flickerTimer > 5) {
                flickerTimer = 0;
                if (Math.random() < 0.1) {
                    flickerIntensity = Math.random() * 0.5;
                } else {
                    flickerIntensity *= 0.9;
                }
            }

            const flashlight = camera.children.find(c => c instanceof THREE.SpotLight);
            if (flashlight) {
                flashlight.intensity = 1 - flickerIntensity;
            }
        }

        function updateHeartbeat() {
            const nearestMonster = Math.min(...monsters.map(m =>
                Math.hypot(player.x - m.position.x, player.z - m.position.z)
            ));

            if (nearestMonster < 10) {
                heartbeatTimer++;
                const rate = Math.max(30, nearestMonster * 5);
                if (heartbeatTimer > rate) {
                    heartbeatTimer = 0;
                    playHeartbeat();
                }
            }
        }

        function endGame(victory, text) {
            gameRunning = false;
            document.exitPointerLock();

            if (footstepInterval) clearInterval(footstepInterval);
            if (ambientSoundInterval) clearInterval(ambientSoundInterval);

            const screen = document.getElementById('gameOverScreen');
            const title = document.getElementById('gameOverTitle');
            const msg = document.getElementById('gameOverText');

            if (victory) {
                title.textContent = '탈출 성공!';
                title.style.color = '#00ff00';
                msg.textContent = '당신은 저택에서 탈출했습니다!';
                playSound(523, 0.2, 'sine', 0.1);
                setTimeout(() => playSound(659, 0.2, 'sine', 0.1), 200);
                setTimeout(() => playSound(784, 0.4, 'sine', 0.1), 400);
            } else {
                title.textContent = '게임 오버';
                title.style.color = '#8b0000';
                msg.textContent = text || '당신은 저택에 갇혔습니다...';
                playSound(100, 1, 'sawtooth', 0.2);
            }

            screen.style.display = 'flex';
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (gameRunning) {
                updatePlayer(delta);
                updateMonsters(delta);
                updateFlashlight(delta);
                updateHeartbeat();
                checkInteractions();

                if (jumpscareCooldown > 0) {
                    jumpscareCooldown -= delta * 1000;
                }

                // 침묵력이 낮으면 화면 효과
                if (sanity < 30) {
                    const vignette = document.getElementById('vignette');
                    vignette.style.background = 'radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 100%)';
                }
            }

            // 침묵력 이펙트
            keyObjects.forEach(key => {
                if (!key.userData.collected) {
                    key.rotation.y += 0.02;
                    key.position.y = 1.5 + Math.sin(Date.now() * 0.003) * 0.2;
                }
            });

            // 침묵력 이펙트
            if (exitDoor && keysCollected >= totalKeys) {
                exitDoor.material.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.005) * 0.3;
            }

            // 침묵력 이펙트
            camera.position.set(player.x, player.y, player.z);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.angle;
            camera.rotation.x = player.pitch;

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
